name: Continuous Base opportunity scan (read-only)

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: base-readonly-opportunity-scan
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout reviewed scanner branch
        uses: actions/checkout@v4
        with:
          ref: dev/flashloan-bot-build
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install scanner dependencies
        run: npm install --omit=dev
      - name: Scan current Base Mainnet opportunities (read-only)
        env:
          RPC_URL: ${{ secrets.BASE_RPC_URL || 'https://mainnet.base.org' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node scanner.js
      - name: Save scan results
        if: always() && hashFiles('opportunities.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: base-opportunities-${{ github.run_number }}
          path: opportunities.json
          retention-days: 7
