
name: Base market scan and guarded arbitrage executor (external 5-minute trigger)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: base-market-scan-and-execution
  cancel-in-progress: false

jobs:
  scan-and-execute:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout bot source
        uses: actions/checkout@v4
        with:
          ref: dev/flashloan-bot-build

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --omit=dev --no-audit --no-fund

      - name: Discover newly launched Base tokens (watchlist only)
        run: node new-token-discovery.js

      - name: Check JavaScript syntax
        run: node --check scanner.js && node --check executor.js && node --check bot.js

      - name: Scan and guarded live execution
        env:
          RPC_URL: ${{ secrets.BASE_RPC_URL || 'https://mainnet.base.org' }}
          EXECUTOR_ADDRESS: "0x97C13D5C5Defa62901558Ccb00CF8eE04A7CEb6F"
          EXECUTOR_CODE_HASH: "0x5c3cc506c7748ecc0ff7a034f1b1aeff80600b8576fc52f1f35db56b724f0ef4"
          WALLET_PRIVATE_KEY: ${{ secrets.WALLET_PRIVATE_KEY }}
          LIVE_TRADING: "true"
          CONFIRM_LIVE_TRADING: "I_ACCEPT_TRANSACTION_RISK"
          SCAN_INTERVAL_MS: "300000"
          RUN_ONCE: "true"
          SLIPPAGE_BPS: "30"
          GAS_BUFFER_BPS: "20000"
        run: node bot.js

      - name: Upload scan results
        if: always() && hashFiles('opportunities.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: base-market-scan-${{ github.run_id }}
          path: |
            opportunities.json
            new-token-watchlist.json
          retention-days: 7
