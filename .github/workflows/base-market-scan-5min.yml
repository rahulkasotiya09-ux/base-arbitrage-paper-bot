name: Base market scan (every 5 minutes)

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/base-market-scan-5min.yml"

permissions:
  contents: read

concurrency:
  group: base-market-scan
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/flashloan-bot-build
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install --omit=dev --no-audit --no-fund
      - name: Check scanner syntax
        run: node --check scanner.js
      - name: Scan Base routes (read-only; no signing or transactions)
        env:
          RPC_URL: ${{ secrets.BASE_RPC_URL || 'https://mainnet.base.org' }}
        run: node scanner.js
      - name: Upload scan results
        if: always() && hashFiles('opportunities.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: base-market-scan-${{ github.run_id }}
          path: opportunities.json
          retention-days: 7
