name: Base direct EOA deployment preflight (no broadcast)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: base-direct-deployment-preflight
  cancel-in-progress: false

jobs:
  estimate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout reviewed bot branch
        uses: actions/checkout@v4
        with:
          ref: dev/flashloan-bot-build
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install --omit=dev --no-audit --no-fund
      - name: Estimate direct deployment from existing EOA wallet (read-only)
        env:
          BASE_RPC_URL: ${{ secrets.BASE_RPC_URL || 'https://mainnet.base.org' }}
          AAVE_POOL_ADDRESSES_PROVIDER: '0xe20fCBdBfFC4Dd138cE8b2E6FBb6CB49777ad64D'
          AAVE_POOL_EXPECTED: '0xA238Dd80C259a72e81d7e4664a9801593F98d1c5'
        run: |
          set -o pipefail
          node base-mainnet-readonly-deploy-estimate.js | tee direct-deployment-estimate.json
      - name: Upload direct deployment estimate
        if: always() && hashFiles('direct-deployment-estimate.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: base-direct-deployment-estimate-${{ github.run_number }}
          path: direct-deployment-estimate.json
          retention-days: 7
