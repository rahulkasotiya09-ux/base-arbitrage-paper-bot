name: Base mainnet EOA deployment gas estimate (read-only)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  estimate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/flashloan-bot-build
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Validate estimate script
        run: node --check base-mainnet-eoa-deploy-estimate.js
      - name: Estimate direct EOA deployment cost (read-only)
        env:
          BASE_RPC_URL: ${{ secrets.BASE_RPC_URL }}
          WALLET_PRIVATE_KEY: ${{ secrets.WALLET_PRIVATE_KEY }}
          AAVE_POOL_ADDRESSES_PROVIDER: ${{ vars.AAVE_POOL_ADDRESSES_PROVIDER }}
          AAVE_POOL_EXPECTED: ${{ vars.AAVE_POOL_EXPECTED }}
        run: node base-mainnet-eoa-deploy-estimate.js
