name: Base Mainnet read-only arbitrage scan

on:
  workflow_dispatch:
  push:
    branches: [dev/flashloan-bot-build]
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: read

concurrency:
  group: base-arbitrage-readonly-scan
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Base bot source
        uses: actions/checkout@v4
        with:
          ref: dev/flashloan-bot-build
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Check JavaScript syntax
        run: |
          node --check scanner.js
          node --check executor.js
      - name: Read Aave Base reserves (no transactions)
        env:
          BASE_RPC_URL: ${{ secrets.BASE_RPC_URL || 'https://mainnet.base.org' }}
        run: node mainnet-preflight.js
      - name: Scan Base V2 and V3 routes (read-only)
        env:
          RPC_URL: ${{ secrets.BASE_RPC_URL || 'https://mainnet.base.org' }}
        run: npm run scan
      - name: Upload read-only scan results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: base-arbitrage-opportunities
          path: opportunities.json
          if-no-files-found: ignore
          retention-days: 7
