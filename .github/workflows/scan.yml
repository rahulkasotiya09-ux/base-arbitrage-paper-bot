
name: FlashArb Scanner

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Run scanner
        env:
          RPC_URL: ${{ secrets.RPC_URL }}
        run: npm run scan

      - name: Check scan output
        if: always()
        run: |
          echo "Checking scanner output..."
          if [ -f opportunities.json ]; then
            echo "SUCCESS: opportunities.json exists"
            ls -lh opportunities.json
            cat opportunities.json
          else
            echo "ERROR: opportunities.json was not created"
            exit 1
          fi

      - name: Upload scan results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arbitrage-results
          path: opportunities.json
          if-no-files-found: error
          retention-days: 7
