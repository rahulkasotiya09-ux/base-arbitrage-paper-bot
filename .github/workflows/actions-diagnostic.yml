name: Actions diagnostic

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/actions-diagnostic.yml"

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Confirm Actions runner starts
        run: |
          echo "GitHub Actions runner started successfully."
          echo "Event: ${{ github.event_name }}"
          echo "Branch: ${{ github.ref_name }}"
          echo "Commit: ${{ github.sha }}"
