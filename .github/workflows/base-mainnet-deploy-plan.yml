name: Base mainnet sponsored deployment plan (no broadcast)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deployment-plan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/flashloan-bot-build
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Validate deployment planner syntax
        run: node --check base-mainnet-deploy-plan.js
      - name: Compile contract and prepare sponsored UserOperation (no signing or sending)
        env:
          BASE_RPC_URL: ${{ secrets.BASE_RPC_URL }}
          WALLET_PRIVATE_KEY: ${{ secrets.WALLET_PRIVATE_KEY }}
          PIMLICO_API_KEY: ${{ secrets.PIMLICO_API_KEY }}
          AAVE_POOL_ADDRESSES_PROVIDER: ${{ vars.AAVE_POOL_ADDRESSES_PROVIDER }}
          AAVE_POOL_EXPECTED: ${{ vars.AAVE_POOL_EXPECTED }}
        run: node base-mainnet-deploy-plan.js
