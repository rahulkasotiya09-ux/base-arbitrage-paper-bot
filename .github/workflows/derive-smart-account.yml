name: Derive Base Sepolia smart account

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  derive:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BASE_SEPOLIA_RPC_URL: ${{ secrets.BASE_SEPOLIA_RPC_URL }}
      WALLET_PRIVATE_KEY: ${{ secrets.WALLET_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/flashloan-bot-build
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check required secrets are present
        run: |
          test -n "$BASE_SEPOLIA_RPC_URL" || (echo "Missing BASE_SEPOLIA_RPC_URL" && exit 1)
          test -n "$WALLET_PRIVATE_KEY" || (echo "Missing WALLET_PRIVATE_KEY" && exit 1)
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Derive smart-account address
        run: npm run smart-account:address
