name: Base mainnet Aave read-only preflight

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/flashloan-bot-build
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Check script syntax
        run: node --check mainnet-preflight.js
      - name: Read Aave Base mainnet reserves
        run: node mainnet-preflight.js
