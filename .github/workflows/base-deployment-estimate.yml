name: Base deployment cost estimate

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/base-deployment-estimate.yml"

permissions:
  contents: read

jobs:
  estimate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Runner diagnostic
        run: |
          echo "Base deployment estimate runner started"
          echo "Event: ${{ github.event_name }}"
          echo "Branch: ${{ github.ref_name }}"

      - name: Checkout bot source
        uses: actions/checkout@v4
        with:
          ref: dev/flashloan-bot-build

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Validate estimate script
        run: node --check base-mainnet-readonly-deploy-estimate.js

      - name: Read-only Base deployment estimate
        env:
          BASE_RPC_URL: ${{ secrets.BASE_RPC_URL }}
          AAVE_POOL_ADDRESSES_PROVIDER: 0xe20fCBdBfFC4Dd138cE8b2E6FBb6CB49777ad64
          AAVE_POOL_EXPECTED: 0xA238Dd80C259a72e81d7e4664a9801593F98d1c5
        run: node base-mainnet-readonly-deploy-estimate.js
