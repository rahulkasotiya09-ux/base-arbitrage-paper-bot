name: V4 Executor Static Checks

on:
  push:
    branches: [dev/flashloan-bot-build]
    paths:
      - "src/**"
      - "script/**"
      - "scanner.js"
      - "executor.js"
      - "token-security.js"
      - "new-token-discovery.js"
      - "config.json"
      - ".github/workflows/v4-contract-check.yml"
  pull_request:
    paths:
      - "src/**"
      - "script/**"
      - "scanner.js"
      - "executor.js"
      - "config.json"
      - ".github/workflows/v4-contract-check.yml"

permissions:
  contents: read

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: node --check token-security.js && node --check new-token-discovery.js && node --check scanner.js && node --check executor.js && node --check bot.js
      - uses: foundry-rs/foundry-toolchain@v1
      - name: Install forge-std for deployment script compilation
        run: git clone --depth 1 https://github.com/foundry-rs/forge-std lib/forge-std
      - name: Compile all Solidity contracts and deployment scripts
        run: forge build --sizes --skip test
