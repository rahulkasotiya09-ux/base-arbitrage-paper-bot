name: Base mainnet deployment estimate diagnostic

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/base-mainnet-readonly-deploy-estimate.yml"

permissions:
  contents: read

jobs:
  estimate:
    runs-on: ubuntu-latest
    steps:
      - name: Confirm Actions runner starts
        run: |
          echo "Deployment workflow runner started successfully."
          echo "Event: ${{ github.event_name }}"
          echo "Branch: ${{ github.ref_name }}"
          echo "This is a read-only diagnostic; no wallet or transaction is used."
