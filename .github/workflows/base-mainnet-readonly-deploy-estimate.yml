name: Base mainnet deployment cost estimate

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/base-mainnet-readonly-deploy-estimate.yml"

permissions:
  contents: read

jobs:
  estimate:
    runs-on: ubuntu-latest
    steps:
      - name: Confirm Actions runner starts
        run: echo "Read-only deployment estimate starting"

      - name: Checkout bot source
        uses: actions/checkout@v4
        with:
          ref: dev/flashloan-bot-build

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Validate estimate script
        run: node --check base-mainnet-readonly-deploy-estimate.js

      - name: Estimate Base deployment cost (read-only)
        run: node base-mainnet-readonly-deploy-estimate.js
