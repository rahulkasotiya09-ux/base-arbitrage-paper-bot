name: Base mainnet deployment preparation (read-only)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/flashloan-bot-build
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Check script syntax
        run: node --check base-mainnet-deployment-preflight.js
      - name: Check Base mainnet deployment configuration
        env:
          BASE_RPC_URL: ${{ secrets.BASE_RPC_URL }}
          WALLET_PRIVATE_KEY: ${{ secrets.WALLET_PRIVATE_KEY }}
          AAVE_POOL_ADDRESSES_PROVIDER: ${{ vars.AAVE_POOL_ADDRESSES_PROVIDER }}
          AAVE_POOL_EXPECTED: ${{ vars.AAVE_POOL_EXPECTED }}
        run: node base-mainnet-deployment-preflight.js
