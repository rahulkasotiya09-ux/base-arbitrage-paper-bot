name: Prepare Base executor deployment (simulation only)

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/prepare-base-executor-deployment.yml'

permissions:
  contents: read

concurrency:
  group: prepare-base-flasharb-deployment
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout deployment source
        uses: actions/checkout@v4
        with:
          ref: dev/flashloan-bot-build

      - name: Set up Node for bot validation
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install bot dependencies and validate JavaScript
        run: |
          npm install --omit=dev --no-audit --no-fund
          node --check scanner.js
          node --check executor.js
          node --check bot.js
          npm audit --omit=dev --audit-level=high

      - name: Set up Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Install forge-std
        run: forge install foundry-rs/forge-std --no-git

      - name: Compile contract and deployment script
        run: forge build

      - name: Read deployer ETH balance (read-only)
        env:
          BASE_RPC_URL: ${{ secrets.BASE_RPC_URL || 'https://mainnet.base.org' }}
        run: |
          set -euo pipefail
          echo "Deployer: 0x88073Ad37F9e1cb6E09048c57fAe4A70383D9aBb"
          cast balance 0x88073Ad37F9e1cb6E09048c57fAe4A70383D9aBb --ether --rpc-url "$BASE_RPC_URL"

      - name: Simulate Base deployment without signing or broadcasting
        env:
          BASE_RPC_URL: ${{ secrets.BASE_RPC_URL || 'https://mainnet.base.org' }}
          WALLET_PRIVATE_KEY: ${{ secrets.WALLET_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "$WALLET_PRIVATE_KEY" || { echo "Missing WALLET_PRIVATE_KEY secret"; exit 1; }
          forge script script/DeployBase.s.sol:DeployBase \
            --rpc-url "$BASE_RPC_URL" \
            --private-key "$WALLET_PRIVATE_KEY" \
            -vvv

      - name: Upload simulated deployment records
        if: always() && hashFiles('broadcast/**') != ''
        uses: actions/upload-artifact@v4
        with:
          name: base-flasharb-deployment-simulation-${{ github.run_id }}
          path: broadcast/
          retention-days: 14

# Deployment script source is checked out from dev/flashloan-bot-build.
